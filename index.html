<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nutri-Rosi — Reservar hora</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f4f1e6;
      --ink: #172a1e;
      --ink-soft: #5b6559;
      --berry: #9c2c46;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--paper);
      font-family: 'Work Sans', ui-sans-serif, system-ui, sans-serif;
      color: var(--ink);
    }
    body { display: flex; flex-direction: column; }
    header {
      padding: 14px 20px;
      text-align: center;
      border-bottom: 1px solid #e3ddc9;
      flex: none;
    }
    header .brand {
      font-family: 'Bitter', Georgia, serif;
      font-weight: 700;
      font-size: 19px;
      margin: 0;
    }
    header .brand span { color: var(--berry); }
    header .tagline {
      margin: 2px 0 0;
      font-size: 12.5px;
      color: var(--ink-soft);
    }
    main { flex: 1; min-height: 0; }
    iframe { border: none; width: 100%; height: 100%; display: block; }
    noscript {
      display: block;
      text-align: center;
      padding: 60px 20px;
    }
    noscript a { color: var(--berry); font-weight: 600; }
  </style>
</head>
<body>
  <header>
    <p class="brand">Nutri<span>-Rosi</span></p>
    <p class="tagline">Reserva tu hora online</p>
  </header>
  <main>
    <!--
      Esta página muestra la aplicación de reservas, que corre en Google
      Apps Script (ahí se guardan las reservas y se envían los correos).
      Si vuelves a implementar el proyecto de Apps Script como una
      implementación NUEVA (no como "nueva versión" de la misma), la URL
      cambia y hay que actualizarla aquí abajo.
    -->
    <iframe
      src="https://script.google.com/macros/s/AKfycbxSrrzlxHkp2Ob1mvi1PXAOLl46Ibu9Dy4t6TOXPNklfvbhGUq-7LlVsIbHaV9l3JgCFA/exec"
      title="Reservar hora — Nutri-Rosi">
    </iframe>
  </main>
  <noscript>
    <a href="https://script.google.com/macros/s/AKfycbxSrrzlxHkp2Ob1mvi1PXAOLl46Ibu9Dy4t6TOXPNklfvbhGUq-7LlVsIbHaV9l3JgCFA/exec">Haz clic aquí para reservar tu hora</a>
  </noscript>
</body>
</html>
