<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f4f1e6;
      --card: #ffffff;
      --ink: #172a1e;
      --ink-soft: #5b6559;
      --rule: #e3ddc9;
      --berry: #9c2c46;
      --berry-dark: #7c2338;
      --berry-soft: #f6e6ea;
      --gold: #b47a1f;
      --gold-soft: #f7ecd9;
      --ok-bg: #eaf3ec;
      --ok-ink: #1c5f4a;
      --err-bg: #fbeaea;
      --err-ink: #9c2c2c;
      --muted-bg: #eceae2;
      --muted-ink: #5b6559;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: 'Work Sans', ui-sans-serif, system-ui, sans-serif;
      padding: 0 0 60px;
    }
    a { color: inherit; }

    /* ---------- Login ---------- */
    #login {
      max-width: 360px;
      margin: 80px auto 0;
      background: var(--card);
      border: 1px solid var(--rule);
      border-radius: 6px;
      padding: 32px 28px;
    }
    #login h1 {
      font-family: 'Bitter', Georgia, serif;
      font-size: 22px;
      margin: 0 0 4px;
    }
    #login h1 span { color: var(--berry); }
    #login p.sub {
      margin: 0 0 22px;
      font-size: 14px;
      color: var(--ink-soft);
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin: 14px 0 6px;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      font-size: 15px;
      font-family: inherit;
      border: 1px solid var(--rule);
      border-radius: 4px;
      background: var(--paper);
      color: var(--ink);
    }
    input:focus, select:focus, textarea:focus {
      outline: 2px solid var(--berry);
      outline-offset: 1px;
    }
    button {
      font-family: inherit;
      cursor: pointer;
    }
    button.primary {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      background: var(--berry);
      border: none;
      border-radius: 4px;
    }
    button.primary:hover { background: var(--berry-dark); }
    button.primary:disabled { opacity: .5; cursor: default; }
    .msg {
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 4px;
      font-size: 13.5px;
      display: none;
    }
    .msg.err { display: block; background: var(--err-bg); color: var(--err-ink); }
    .msg.ok { display: block; background: var(--ok-bg); color: var(--ok-ink); }

    /* ---------- App shell ---------- */
    #app { display: none; }
    header.topbar {
      background: var(--card);
      border-bottom: 1px solid var(--rule);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    header.topbar .brand {
      font-family: 'Bitter', Georgia, serif;
      font-weight: 700;
      font-size: 18px;
    }
    header.topbar .brand span { color: var(--berry); }
    header.topbar .who {
      font-size: 13px;
      color: var(--ink-soft);
    }
    header.topbar .who b { color: var(--ink); }
    .logout {
      background: none;
      border: 1px solid var(--rule);
      border-radius: 4px;
      padding: 6px 12px;
      font-size: 13px;
      color: var(--ink-soft);
    }
    .logout:hover { border-color: var(--berry); color: var(--berry); }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 20px;
    }

    .tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--rule);
    }
    .tab-btn {
      background: none;
      border: none;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      color: var(--ink-soft);
      border-bottom: 2px solid transparent;
    }
    .tab-btn.active {
      color: var(--berry);
      border-bottom-color: var(--berry);
    }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ---------- Reservas list ---------- */
    .reserva-card {
      background: var(--card);
      border: 1px solid var(--rule);
      border-radius: 6px;
      padding: 16px 18px;
      margin-bottom: 12px;
    }
    .reserva-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      flex-wrap: wrap;
    }
    .reserva-fecha {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 13px;
      color: var(--ink-soft);
    }
    .reserva-fecha b { color: var(--ink); font-weight: 600; }
    .pill {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .03em;
      text-transform: uppercase;
      padding: 3px 9px;
      border-radius: 20px;
      white-space: nowrap;
    }
    .pill.Confirmada { background: var(--ok-bg); color: var(--ok-ink); }
    .pill.Atendida { background: var(--muted-bg); color: var(--muted-ink); }
    .pill.Cancelada { background: var(--err-bg); color: var(--err-ink); }
    .pill.Bloqueado { background: var(--gold-soft); color: var(--gold); }
    .reserva-nombre {
      font-family: 'Bitter', Georgia, serif;
      font-weight: 700;
      font-size: 17px;
      margin: 8px 0 2px;
    }
    .reserva-detalle {
      font-size: 13.5px;
      color: var(--ink-soft);
      margin: 0;
    }
    .reserva-detalle b { color: var(--ink); font-weight: 600; }
    .reserva-nota {
      margin-top: 10px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .reserva-nota input {
      flex: 1;
      font-size: 13.5px;
      padding: 7px 10px;
    }
    .reserva-nota button {
      flex: none;
      font-size: 12.5px;
      padding: 7px 10px;
      border: 1px solid var(--rule);
      border-radius: 4px;
      background: var(--paper);
      color: var(--ink-soft);
    }
    .reserva-acciones {
      margin-top: 10px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .reserva-acciones button {
      font-size: 12.5px;
      font-weight: 600;
      padding: 7px 12px;
      border-radius: 4px;
      border: 1px solid var(--rule);
      background: var(--paper);
      color: var(--ink);
    }
    .reserva-acciones button.ok:hover { border-color: var(--ok-ink); color: var(--ok-ink); }
    .reserva-acciones button.danger:hover { border-color: var(--err-ink); color: var(--err-ink); }
    .vacio {
      text-align: center;
      padding: 40px 20px;
      color: var(--ink-soft);
      font-size: 14px;
    }

    /* ---------- Bloquear horario ---------- */
    .bloquear-form {
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--rule);
      border-radius: 6px;
      padding: 20px 22px;
    }
    .slots {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(68px, 1fr));
      gap: 8px;
      margin-top: 8px;
    }
    .slot-btn {
      padding: 8px 4px;
      font-size: 13.5px;
      border: 1px solid var(--rule);
      border-radius: 4px;
      background: var(--paper);
      color: var(--ink);
    }
    .slot-btn:hover { border-color: var(--berry); }
    .slot-btn.selected { background: var(--berry); border-color: var(--berry); color: #fff; }
    .hint { font-size: 12.5px; color: var(--ink-soft); margin-top: 8px; }
  </style>
</head>
<body>

  <div id="login">
    <h1>Dashboard — <span>Nutri-Rosi</span></h1>
    <p class="sub">Ingresa con tu usuario y contraseña.</p>
    <form id="loginForm">
      <label for="usuario">Usuario</label>
      <input type="text" id="usuario" autocomplete="username" required>
      <label for="password">Contraseña</label>
      <input type="password" id="password" autocomplete="current-password" required>
      <button type="submit" class="primary" id="loginBtn">Ingresar</button>
    </form>
    <div class="msg" id="loginMsg"></div>
  </div>

  <div id="app">
    <header class="topbar">
      <div class="brand">Nutri<span>-Rosi</span> · Dashboard</div>
      <div class="who">
        Hola, <b id="whoNombre"></b> <span id="whoRol"></span>
        <button class="logout" id="logoutBtn" style="margin-left:10px;">Cerrar sesión</button>
      </div>
    </header>

    <main>
      <div class="tabs">
        <button class="tab-btn active" data-tab="horas">Mis horas</button>
        <button class="tab-btn" data-tab="bloquear" id="tabBloquearBtn">Bloquear horario</button>
      </div>

      <section class="tab-panel active" id="panelHoras">
        <div id="listaReservas"></div>
      </section>

      <section class="tab-panel" id="panelBloquear">
        <div class="bloquear-form">
          <label for="bSucursal">Sucursal</label>
          <select id="bSucursal" required><option value="">Cargando...</option></select>

          <label for="bFecha">Fecha</label>
          <input type="date" id="bFecha" required>

          <label>Horario</label>
          <div class="slots" id="bSlots"></div>
          <div class="hint" id="bHint">Elige sucursal y fecha para ver horarios.</div>

          <label for="bMotivo">Motivo (opcional)</label>
          <input type="text" id="bMotivo" placeholder="Ej: vacaciones, hora personal">

          <button type="button" class="primary" id="bloquearBtn" disabled>Bloquear horario</button>
          <div class="msg" id="bMsg"></div>
        </div>
      </section>
    </main>
  </div>

  <script>
    let TOKEN = sessionStorage.getItem('nr_token') || null;
    let ROL = sessionStorage.getItem('nr_rol') || null;
    let NOMBRE = sessionStorage.getItem('nr_nombre') || null;
    let horaBloqueoSeleccionada = null;

    if (TOKEN) mostrarApp();

    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const usuario = document.getElementById('usuario').value;
      const password = document.getElementById('password').value;
      const btn = document.getElementById('loginBtn');
      const msg = document.getElementById('loginMsg');
      msg.className = 'msg';
      btn.disabled = true;
      btn.textContent = 'Ingresando...';

      google.script.run
        .withSuccessHandler(function (res) {
          btn.disabled = false;
          btn.textContent = 'Ingresar';
          if (!res.ok) {
            msg.className = 'msg err';
            msg.textContent = res.mensaje;
            return;
          }
          TOKEN = res.token; ROL = res.rol; NOMBRE = res.nombre;
          sessionStorage.setItem('nr_token', TOKEN);
          sessionStorage.setItem('nr_rol', ROL);
          sessionStorage.setItem('nr_nombre', NOMBRE);
          mostrarApp();
        })
        .withFailureHandler(function (err) {
          btn.disabled = false;
          btn.textContent = 'Ingresar';
          msg.className = 'msg err';
          msg.textContent = 'Error: ' + err.message;
        })
        .login(usuario, password);
    });

    document.getElementById('logoutBtn').addEventListener('click', function () {
      google.script.run.cerrarSesion(TOKEN);
      sessionStorage.clear();
      location.reload();
    });

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', function () {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(btn.dataset.tab === 'horas' ? 'panelHoras' : 'panelBloquear').classList.add('active');
      });
    });

    function mostrarApp() {
      document.getElementById('login').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      document.getElementById('whoNombre').textContent = NOMBRE;
      document.getElementById('whoRol').textContent = '(' + ROL + ')';

      if (ROL === 'admin') {
        document.getElementById('tabBloquearBtn').style.display = 'none';
      }

      cargarReservas();
      cargarSucursalesBloqueo();
    }

    function manejarSesionExpirada_(err) {
      if (/sesión expiró/i.test(err.message)) {
        sessionStorage.clear();
        location.reload();
        return true;
      }
      return false;
    }

    // ---------- Mis horas ----------

    function cargarReservas() {
      const cont = document.getElementById('listaReservas');
      cont.innerHTML = '<p class="vacio">Cargando...</p>';

      google.script.run
        .withSuccessHandler(function (res) {
          pintarReservas(res.filas);
        })
        .withFailureHandler(function (err) {
          if (manejarSesionExpirada_(err)) return;
          cont.innerHTML = '<p class="vacio">No se pudo cargar: ' + err.message + '</p>';
        })
        .getMisReservas(TOKEN);
    }

    function pintarReservas(filas) {
      const cont = document.getElementById('listaReservas');
      cont.innerHTML = '';

      if (!filas.length) {
        cont.innerHTML = '<p class="vacio">No tienes horas agendadas.</p>';
        return;
      }

      filas.forEach(r => {
        const card = document.createElement('div');
        card.className = 'reserva-card';

        const esBloqueo = r.estado === 'Bloqueado';
        const tituloNombre = esBloqueo ? 'Horario bloqueado' : r.nombre;

        let accionesHtml = '';
        if (r.estado === 'Confirmada') {
          accionesHtml = `
            <div class="reserva-acciones">
              <button class="ok" data-accion="Atendida">Marcar atendida</button>
              <button class="danger" data-accion="Cancelada">Cancelar</button>
            </div>`;
        } else if (esBloqueo) {
          accionesHtml = `
            <div class="reserva-acciones">
              <button class="ok" data-accion="liberar">Liberar horario</button>
            </div>`;
        }

        const notaHtml = !esBloqueo ? `
          <div class="reserva-nota">
            <input type="text" value="${(r.nota || '').replace(/"/g, '&quot;')}" placeholder="Agregar nota..." data-nota-input>
            <button data-accion="nota">Guardar</button>
          </div>` : '';

        card.innerHTML = `
          <div class="reserva-top">
            <span class="reserva-fecha"><b>${r.fecha}</b> · ${r.hora}${ROL === 'admin' && r.profesional ? ' · ' + r.profesional : ''}</span>
            <span class="pill ${r.estado}">${r.estado}</span>
          </div>
          <p class="reserva-nombre">${tituloNombre}</p>
          <p class="reserva-detalle">
            ${esBloqueo ? (r.nota ? '<b>Motivo:</b> ' + r.nota : 'Sin motivo indicado') :
              '<b>' + r.servicio + '</b> · ' + r.sucursal + (r.telefono ? ' · ' + r.telefono : '') + (r.email ? ' · ' + r.email : '')}
          </p>
          ${accionesHtml}
          ${notaHtml}
        `;

        card.querySelectorAll('[data-accion]').forEach(btn => {
          btn.addEventListener('click', function () {
            const accion = btn.dataset.accion;
            if (accion === 'nota') {
              const valor = card.querySelector('[data-nota-input]').value;
              btn.disabled = true; btn.textContent = 'Guardando...';
              google.script.run
                .withSuccessHandler(function () { btn.disabled = false; btn.textContent = 'Guardado ✓'; setTimeout(() => btn.textContent = 'Guardar', 1500); })
                .withFailureHandler(function (err) { if (!manejarSesionExpirada_(err)) alert(err.message); btn.disabled = false; btn.textContent = 'Guardar'; })
                .guardarNota(TOKEN, r.fila, valor);
              return;
            }
            if (accion === 'liberar') {
              google.script.run
                .withSuccessHandler(cargarReservas)
                .withFailureHandler(function (err) { if (!manejarSesionExpirada_(err)) alert(err.message); })
                .liberarBloqueo(TOKEN, r.fila);
              return;
            }
            google.script.run
              .withSuccessHandler(cargarReservas)
              .withFailureHandler(function (err) { if (!manejarSesionExpirada_(err)) alert(err.message); })
              .actualizarEstado(TOKEN, r.fila, accion);
          });
        });

        cont.appendChild(card);
      });
    }

    // ---------- Bloquear horario ----------

    function cargarSucursalesBloqueo() {
      google.script.run
        .withSuccessHandler(function (info) {
          const sel = document.getElementById('bSucursal');
          sel.innerHTML = '<option value="">Selecciona una sucursal</option>' +
            info.sucursales.map(s => `<option value="${s}">${s}</option>`).join('');
          document.getElementById('bFecha').min = new Date().toISOString().slice(0, 10);
        })
        .getInfoPublica();
    }

    function cargarHorariosBloqueo() {
      const fecha = document.getElementById('bFecha').value;
      const sucursal = document.getElementById('bSucursal').value;
      const cont = document.getElementById('bSlots');
      const hint = document.getElementById('bHint');
      horaBloqueoSeleccionada = null;
      document.getElementById('bloquearBtn').disabled = true;
      cont.innerHTML = '';

      if (!fecha || !sucursal) {
        hint.textContent = 'Elige sucursal y fecha para ver horarios.';
        return;
      }
      hint.textContent = 'Buscando horarios...';

      google.script.run
        .withSuccessHandler(function (slots) {
          cont.innerHTML = '';
          if (!slots.length) {
            hint.textContent = 'No hay horarios libres ese día.';
            return;
          }
          hint.textContent = '';
          slots.forEach(h => {
            const b = document.createElement('button');
            b.type = 'button';
            b.className = 'slot-btn';
            b.textContent = h;
            b.onclick = function () {
              document.querySelectorAll('#bSlots .slot-btn').forEach(x => x.classList.remove('selected'));
              b.classList.add('selected');
              horaBloqueoSeleccionada = h;
              document.getElementById('bloquearBtn').disabled = false;
            };
            cont.appendChild(b);
          });
        })
        .withFailureHandler(function (err) {
          if (manejarSesionExpirada_(err)) return;
          hint.textContent = 'No se pudo cargar: ' + err.message;
        })
        .getHorariosDisponibles(fecha, sucursal, ROL);
    }

    document.getElementById('bFecha').addEventListener('change', cargarHorariosBloqueo);
    document.getElementById('bSucursal').addEventListener('change', cargarHorariosBloqueo);

    document.getElementById('bloquearBtn').addEventListener('click', function () {
      const btn = this;
      const msg = document.getElementById('bMsg');
      msg.className = 'msg';
      btn.disabled = true;
      btn.textContent = 'Bloqueando...';

      google.script.run
        .withSuccessHandler(function (res) {
          btn.textContent = 'Bloquear horario';
          if (res.ok) {
            msg.className = 'msg ok';
            msg.textContent = res.mensaje;
            document.getElementById('bMotivo').value = '';
            cargarHorariosBloqueo();
            cargarReservas();
          } else {
            msg.className = 'msg err';
            msg.textContent = res.mensaje;
            btn.disabled = false;
          }
        })
        .withFailureHandler(function (err) {
          btn.disabled = false;
          btn.textContent = 'Bloquear horario';
          if (manejarSesionExpirada_(err)) return;
          msg.className = 'msg err';
          msg.textContent = 'Error: ' + err.message;
        })
        .bloquearHorario(TOKEN, {
          fecha: document.getElementById('bFecha').value,
          hora: horaBloqueoSeleccionada,
          sucursal: document.getElementById('bSucursal').value,
          motivo: document.getElementById('bMotivo').value
        });
    });
  </script>
</body>
</html>
